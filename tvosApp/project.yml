name: Tuner
options:
  bundleIdPrefix: app.tuner
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Tuner:
    type: application
    platform: tvOS
    sources:
      - Tuner
    info:
      path: Tuner/Info.plist
      properties:
        CFBundleDisplayName: Tuner
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tuner.tv
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, TunerCore, -lsqlite3]
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home}"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
  TunerUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - TunerUITests
    dependencies:
      - target: Tuner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tuner.tv.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tuner
schemes:
  Tuner:
    build:
      targets:
        Tuner: all
        TunerUITests: [test]
    test:
      targets:
        - TunerUITests
