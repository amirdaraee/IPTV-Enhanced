name: Tuner
options:
  bundleIdPrefix: com.amirdaraee
  deploymentTarget:
    tvOS: "17.0"
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Tuner:
    type: application
    # One app for Apple TV, iPhone and iPad, so a person buys and updates it once.
    platform: auto
    supportedDestinations: [tvOS, iOS]
    deploymentTarget:
      tvOS: "17.0"
      iOS: "17.0"
    sources:
      - Tuner
      # Settings → About shows these licence texts.
      - path: ../licenses/GPL-3.0.txt
        buildPhase: resources
      - path: ../licenses/third-party.txt
        buildPhase: resources
    info:
      path: Tuner/Info.plist
      properties:
        CFBundleDisplayName: IPTV Enhanced
        CFBundleShortVersionString: "0.2.1"
        CFBundleVersion: "5"
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        # Landscape like a TV. Full screen because the guide doesn't fit iPad split view.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiredDeviceCapabilities: [arm64]
        # Only the system's HTTPS is used, which is exempt from export documentation.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    # The team comes from the build command, so none is stored here.
    entitlements:
      path: Tuner/Tuner.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    # Fallback player for streams AVPlayer can't decode; tools/vlckit/fetch.sh downloads it.
    dependencies:
      - framework: Vendor/TVVLCKit.xcframework
        embed: true
        destinationFilters: [tvOS]
      - framework: Vendor/MobileVLCKit.xcframework
        embed: true
        destinationFilters: [iOS]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirdaraee.iptv
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphoneos*]": AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=iphonesimulator*]": AppIcon
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: [-framework, TunerCore, -lsqlite3]
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
    preBuildScripts:
      - name: Build Kotlin shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          export JAVA_HOME="${JAVA_HOME:-/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home}"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    postBuildScripts:
      # The iOS VLCKit build still carries 32-bit slices, which the store rejects in an arm64-only
      # app. Runs after embedding, so the thinned framework is signed again.
      - name: Thin VLCKit
        basedOnDependencyAnalysis: false
        script: |
          fw="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH/MobileVLCKit.framework"
          [ -f "$fw/MobileVLCKit" ] || exit 0
          thinned=no
          for arch in $(lipo -archs "$fw/MobileVLCKit"); do
            case " $ARCHS " in *" $arch "*) ;; *) lipo -remove "$arch" "$fw/MobileVLCKit" -o "$fw/MobileVLCKit"; thinned=yes ;; esac
          done
          if [ "$thinned" = yes ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --preserve-metadata=identifier "$fw"
          fi
  TunerUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources:
      - TunerUITests
    dependencies:
      - target: Tuner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirdaraee.iptv.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tuner
  TunerTouchTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TunerTouchTests
    dependencies:
      - target: Tuner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amirdaraee.iptv.touchtests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Tuner
schemes:
  TunerTouch:
    build:
      targets:
        Tuner: all
        TunerTouchTests: [test]
    test:
      targets:
        - TunerTouchTests
  Tuner:
    build:
      targets:
        Tuner: all
        TunerUITests: [test]
    test:
      targets:
        - TunerUITests
